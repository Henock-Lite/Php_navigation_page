<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Mini SPA - Toutes vues dans index.html</title>
    <link rel="stylesheet" href="./style/style.css">
   
  </head>
  <body>
   
    <nav>

      <a href="#about" data-page="about">À propos</a> |

      <div id="about" class="view">

      <div id="contact" class="view">
        <h1>Contact</h1>
        <p>Formulaire de contact ici.</p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
